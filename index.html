<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1e3c72">
<title>New Year Experience</title>

<style>
:root {
    --glass: rgba(255,255,255,0.15);
    --border: rgba(255,255,255,0.4);
}

* { box-sizing:border-box; margin:0; padding:0; }

body {
    font-family: system-ui, Roboto, Arial, sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    color:#fff;
    text-align:center;
    overflow:hidden;
}

h1 {
    font-size:clamp(2.5rem,5vw,4rem);
    margin-bottom:20px;
    text-shadow:0 10px 25px rgba(0,0,0,.5);
}

.glass {
    background:var(--glass);
    border:1px solid var(--border);
    backdrop-filter:blur(12px);
    border-radius:18px;
    padding:20px 40px;
    box-shadow:0 15px 35px rgba(0,0,0,.4);
    margin:10px 0;
}

#countdown {
    font-size:2.3rem;
}

#countdown.final {
    color:#ffeb3b;
    animation:pulse 1s infinite;
}

@keyframes pulse {
    0%{transform:scale(1)}
    50%{transform:scale(1.1)}
    100%{transform:scale(1)}
}

select {
    margin-top:12px;
    padding:8px 14px;
    border-radius:10px;
    border:none;
    font-size:1rem;
}

canvas {
    position:fixed;
    inset:0;
    pointer-events:none;
}

#badge {
    position:fixed;
    top:30px;
    background:#00e676;
    color:#000;
    padding:14px 26px;
    border-radius:999px;
    font-weight:700;
    display:none;
}

footer {
    position:absolute;
    bottom:18px;
    font-size:.9rem;
    opacity:.85;
}
</style>
</head>

<body>

<h1>New Year Countdown</h1>

<div id="countdown" class="glass"></div>

<div class="glass">
    Timezone:
    <select id="tz">
        <option value="Asia/Kolkata">India 🇮🇳</option>
        <option value="UTC">UTC 🌍</option>
        <option value="America/New_York">New York 🇺🇸</option>
        <option value="Asia/Tokyo">Tokyo 🇯🇵</option>
    </select>
</div>

<div class="glass">
    Local Time:
    <strong><span id="time"></span></strong>
</div>

<div id="badge">🏆 Achievement Unlocked: New Year Survivor</div>

<canvas id="fx"></canvas>

<footer>
© 2024 M. Taezeem Tariq Matta
</footer>

<script>
const countdownEl = document.getElementById("countdown");
const timeEl = document.getElementById("time");
const tzSelect = document.getElementById("tz");
const badge = document.getElementById("badge");
const canvas = document.getElementById("fx");
const ctx = canvas.getContext("2d");

let tz = tzSelect.value;
let particles = [];
let started = false;
let tickPlayed = false;

const tick = new Audio("data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=");
const boom = new Audio("data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=");

function resize(){ canvas.width=innerWidth; canvas.height=innerHeight }
addEventListener("resize",resize); resize();

tzSelect.onchange = () => tz = tzSelect.value;

function nextNY(){
    const n = new Date();
    return new Date(n.getFullYear()+1,0,1,0,0,0);
}

function updateCountdown(){
    const now = new Date();
    const diff = nextNY() - now;

    if(diff<=0){
        countdownEl.textContent="🎉 HAPPY NEW YEAR 🎉";
        if(!started){
            started=true;
            badge.style.display="block";
            startFX();
        }
        return;
    }

    const d=Math.floor(diff/86400000);
    const h=Math.floor(diff/3600000)%24;
    const m=Math.floor(diff/60000)%60;
    const s=Math.floor(diff/1000)%60;

    countdownEl.textContent=`${d}d ${h}h ${m}m ${s}s`;

    if(d===0&&h===0&&m===0&&s<=10){
        countdownEl.classList.add("final");
        if(!tickPlayed){ tick.play(); tickPlayed=true; }
    }
}

function updateTime(){
    timeEl.textContent = new Date().toLocaleTimeString("en-US",{
        timeZone:tz,
        hour:"2-digit",
        minute:"2-digit",
        second:"2-digit",
        hour12:true
    });
}

function startFX(){
    for(let i=0;i<250;i++){
        particles.push({
            x:Math.random()*canvas.width,
            y:Math.random()*canvas.height,
            dx:(Math.random()-0.5)*6,
            dy:(Math.random()-0.5)*6,
            r:Math.random()*4+2,
            life:Math.random()*80+60,
            c:`hsl(${Math.random()*360},100%,50%)`
        });
    }
    animate();
}

function animate(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    particles.forEach(p=>{
        ctx.beginPath();
        ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
        ctx.fillStyle=p.c;
        ctx.fill();
        p.x+=p.dx; p.y+=p.dy; p.life--;
    });
    particles=particles.filter(p=>p.life>0);
    requestAnimationFrame(animate);
}

setInterval(updateCountdown,1000);
setInterval(updateTime,1000);
updateCountdown(); updateTime();
</script>

</body>
</html>
