<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Ultra-Professional New Year Countdown Experience">
<meta name="author" content="M. Taezeem Tariq Matta">
<title>New Year Countdown</title>

<style>
:root {
    --glass: rgba(255,255,255,0.15);
    --border: rgba(255,255,255,0.4);
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
    font-family: system-ui, Roboto, Arial, sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    color:#fff;
    background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    overflow:hidden;
}

h1 {
    font-size:clamp(2.5rem,5vw,4rem);
    margin-bottom:20px;
    text-shadow:0 10px 25px rgba(0,0,0,.5);
}

.glass {
    background:var(--glass);
    border:1px solid var(--border);
    backdrop-filter:blur(12px);
    border-radius:18px;
    padding:22px 44px;
    box-shadow:0 15px 35px rgba(0,0,0,.4);
}

#countdown {
    font-size:2.2rem;
    letter-spacing:1px;
}

#countdown.final {
    animation:pulse 1s infinite;
    color:#ffeb3b;
}

@keyframes pulse {
    0%{transform:scale(1)}
    50%{transform:scale(1.08)}
    100%{transform:scale(1)}
}

#localTime {
    margin-top:16px;
    font-size:1.3rem;
}

canvas {
    position:fixed;
    inset:0;
    pointer-events:none;
}

footer {
    position:absolute;
    bottom:18px;
    font-size:.95rem;
    opacity:.85;
}

footer a {
    color:#ffcc00;
    text-decoration:none;
}

footer a:hover { text-decoration:underline; }

@media (prefers-reduced-motion: reduce) {
    canvas { display:none; }
}
</style>
</head>

<body>

<h1>Countdown to New Year</h1>

<div id="countdown" class="glass" aria-live="polite"></div>
<div id="localTime" class="glass">
    Sopore, Kashmir Time:
    <strong><span id="time"></span></strong>
</div>

<canvas id="fx"></canvas>

<footer>
© 2024 M. Taezeem Tariq Matta —
<a href="https://taezeem.github.io/WebMan" target="_blank">Visit me</a>
</footer>

<script>
const countdownEl = document.getElementById("countdown");
const timeEl = document.getElementById("time");
const canvas = document.getElementById("fx");
const ctx = canvas.getContext("2d");

let particles = [];
let started = false;

function resize() {
    canvas.width = innerWidth;
    canvas.height = innerHeight;
}
addEventListener("resize", resize);
resize();

function nextNewYear() {
    const n = new Date();
    return new Date(n.getFullYear()+1,0,1,0,0,0,0);
}

function updateCountdown() {
    const now = new Date();
    const diff = nextNewYear() - now;

    if (diff <= 0) {
        countdownEl.textContent = "🎉 HAPPY NEW YEAR 🎉";
        document.title = "🎉 Happy New Year!";
        if (!started) startFireworks();
        return;
    }

    const d = Math.floor(diff/86400000);
    const h = Math.floor(diff/3600000)%24;
    const m = Math.floor(diff/60000)%60;
    const s = Math.floor(diff/1000)%60;

    countdownEl.textContent = `${d}d ${h}h ${m}m ${s}s`;
    document.title = `${d}d ${h}h ${m}m ${s}s`;

    if (d===0 && h===0 && m===0 && s<=10) {
        countdownEl.classList.add("final");
    }
}

function updateTime() {
    timeEl.textContent = new Date().toLocaleTimeString("en-IN",{
        timeZone:"Asia/Kolkata",
        hour:"2-digit",
        minute:"2-digit",
        second:"2-digit",
        hour12:true
    });
}

function startFireworks() {
    started = true;
    for (let i=0;i<250;i++) {
        particles.push({
            x:Math.random()*canvas.width,
            y:Math.random()*canvas.height,
            r:Math.random()*4+2,
            dx:(Math.random()-0.5)*6,
            dy:(Math.random()-0.5)*6,
            life:Math.random()*80+60,
            color:`hsl(${Math.random()*360},100%,50%)`
        });
    }
    animate();
}

function animate() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    particles.forEach(p=>{
        ctx.beginPath();
        ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
        ctx.fillStyle=p.color;
        ctx.fill();

        p.x+=p.dx;
        p.y+=p.dy;
        p.life--;
    });
    particles = particles.filter(p=>p.life>0);
    requestAnimationFrame(animate);
}

setInterval(updateCountdown,1000);
setInterval(updateTime,1000);
updateCountdown();
updateTime();
</script>

</body>
</html>
